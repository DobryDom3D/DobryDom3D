name: Build YafaRay natives

# Manual: rebuilds the YafaRay native libraries (core, plugins and the JNI
# glue in src/.../YafarayRenderer.cpp) from the DobryDom3D/libYafaRay fork, so
# lib/yafaray/<os>/ is reproducible. Artifacts are uploaded; to update the app,
# copy them over lib/yafaray/<os>/<arch>/ and commit. Release builds keep using
# the committed libraries.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit of DobryDom3D/libYafaRay to build
        required: false
        default: dobrydom3d
        type: string

permissions:
  contents: read

jobs:
  linux-x64:
    # The libraries need at least the glibc of the machine they are built on
    # (the committed ones were built on Ubuntu 16.04), so build in an older
    # Ubuntu container than the hosted runners provide.
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
      env:
        DEBIAN_FRONTEND: noninteractive
    timeout-minutes: 30
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install --yes build-essential cmake git patchelf
          g++ --version | head -n 1; cmake --version | head -n 1; ldd --version | head -n 1

      - name: Check out DobryDom3D
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out libYafaRay fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DobryDom3D/libYafaRay
          ref: ${{ inputs.ref }}
          path: libYafaRay

      - name: Set up Java 26 (for jni.h)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "26.0.2+10"

      - name: Build natives
        run: scripts/build-yafaray.sh libYafaRay out/linux-x64

      - name: Compare with the committed libraries
        shell: bash
        run: |
          echo "--- built plugins:   $(ls out/linux-x64/yafaray-plugins | wc -l)"
          echo "--- committed plugins: $(ls lib/yafaray/linux/x64/yafaray-plugins | wc -l)"
          diff <(ls out/linux-x64/yafaray-plugins) <(ls lib/yafaray/linux/x64/yafaray-plugins) && echo "plugin sets identical"
          for f in libyafaray_v3_core.so libyafarayjni.so; do
            echo "== $f (built)";     readelf -d "out/linux-x64/$f" | grep -E 'NEEDED|RPATH|RUNPATH'
            echo "== $f (committed)"; readelf -d "lib/yafaray/linux/x64/$f" | grep -E 'NEEDED|RPATH|RUNPATH'
          done
          objdump -T out/linux-x64/libyafaray_v3_core.so | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1 | sed 's/^/max glibc needed: /'
        continue-on-error: true

      - name: Test the built libraries with the application's YafaRay test
        run: |
          apt-get install --yes ant ant-optional
          rm -rf lib/yafaray/linux/x64
          mkdir -p lib/yafaray/linux/x64
          cp -r out/linux-x64/. lib/yafaray/linux/x64/
          ant -noinput test-yafaray

      - name: Upload natives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yafaray-linux-x64
          path: out/linux-x64
          if-no-files-found: error
