name: Build YafaRay natives

# Manual: rebuilds the YafaRay native libraries (core, plugins and the JNI
# glue in src/.../YafarayRenderer.cpp) from the DobryDom3D/libYafaRay fork, so
# the natives are reproducible. Artifacts are uploaded. With release_tag set the
# libraries are also published as a GitHub release; the application then
# fetches them from there (see natives/yafaray.properties and the
# fetch-yafaray-natives target in build.xml).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit of DobryDom3D/libYafaRay to build
        required: false
        default: dobrydom3d
        type: string
      release_tag:
        description: If set (e.g. yafaray-natives-1), publish the built libraries as assets of a new GitHub release with this tag
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  linux-x64:
    # The libraries need at least the glibc of the machine they are built on
    # (the committed ones were built on Ubuntu 16.04), so build in an older
    # Ubuntu container than the hosted runners provide.
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
      env:
        DEBIAN_FRONTEND: noninteractive
    timeout-minutes: 30
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install --yes build-essential cmake git patchelf
          g++ --version | head -n 1; cmake --version | head -n 1; ldd --version | head -n 1

      - name: Check out DobryDom3D
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out libYafaRay fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DobryDom3D/libYafaRay
          ref: ${{ inputs.ref }}
          path: libYafaRay

      - name: Set up Java 26 (for jni.h)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "26.0.2+10"

      - name: Build natives
        run: scripts/build-yafaray.sh libYafaRay out/linux-x64

      - name: Compare with the committed libraries
        shell: bash
        run: |
          echo "--- built plugins:   $(ls out/linux-x64/yafaray-plugins | wc -l)"
          echo "--- committed plugins: $(ls lib/yafaray/linux/x64/yafaray-plugins | wc -l)"
          diff <(ls out/linux-x64/yafaray-plugins) <(ls lib/yafaray/linux/x64/yafaray-plugins) && echo "plugin sets identical"
          for f in libyafaray_v3_core.so libyafarayjni.so; do
            echo "== $f (built)";     readelf -d "out/linux-x64/$f" | grep -E 'NEEDED|RPATH|RUNPATH'
            echo "== $f (committed)"; readelf -d "lib/yafaray/linux/x64/$f" | grep -E 'NEEDED|RPATH|RUNPATH'
          done
          objdump -T out/linux-x64/libyafaray_v3_core.so | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1 | sed 's/^/max glibc needed: /'
        continue-on-error: true

      - name: Test the built libraries with the application's YafaRay test
        run: |
          apt-get install --yes ant ant-optional xvfb libgl1 libglu1-mesa libgl1-mesa-dri libxi6 libxrender1 libxtst6 libxxf86vm1
          rm -rf lib/yafaray/linux/x64
          mkdir -p lib/yafaray/linux/x64
          cp -r out/linux-x64/. lib/yafaray/linux/x64/
          xvfb-run -a -s "-screen 0 1920x1080x24 -ac +extension GLX +render -noreset" ant -noinput test-yafaray

      - name: Upload natives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yafaray-linux-x64
          path: out/linux-x64
          if-no-files-found: error

  macos:
    name: macos-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    steps:
      - name: Check out DobryDom3D
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out libYafaRay fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DobryDom3D/libYafaRay
          ref: ${{ inputs.ref }}
          path: libYafaRay

      - name: Set up Java 26 (for jni.h)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "26.0.2+10"

      - name: Build natives
        env:
          ARCH: ${{ matrix.arch }}
        run: scripts/build-yafaray.sh libYafaRay out/macos-${{ matrix.arch }}

      - name: Show linkage
        run: |
          file out/macos-${{ matrix.arch }}/*.dylib
          for f in libyafaray_v3_core.dylib libyafarayjni.dylib; do
            echo "== $f (built)"; otool -L out/macos-${{ matrix.arch }}/$f; otool -l out/macos-${{ matrix.arch }}/$f | grep -A2 LC_RPATH | grep path
          done
          echo "== libsimple.dylib (built)"; otool -L out/macos-${{ matrix.arch }}/yafaray-plugins/libsimple.dylib; otool -l out/macos-${{ matrix.arch }}/yafaray-plugins/libsimple.dylib | grep -A2 LC_RPATH | grep path
          echo "== libyafarayjni.dylib (committed)"; otool -L lib/yafaray/macosx/libyafarayjni.dylib; otool -l lib/yafaray/macosx/libyafarayjni.dylib | grep -A2 LC_RPATH | grep path
          echo "== libsimple.dylib (committed)"; otool -L lib/yafaray/macosx/yafaray-plugins/libsimple.dylib; otool -l lib/yafaray/macosx/yafaray-plugins/libsimple.dylib | grep -A2 LC_RPATH | grep path
        continue-on-error: true

      - name: Upload natives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yafaray-macos-${{ matrix.arch }}
          path: out/macos-${{ matrix.arch }}
          if-no-files-found: error

  macos-universal:
    needs: macos
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Download both architectures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: yafaray-macos-*
          path: in

      - name: Merge with lipo
        run: |
          set -euo pipefail
          mkdir -p out/macos/yafaray-plugins
          for f in $(cd in/yafaray-macos-arm64 && find . -name '*.dylib' | sort); do
            lipo -create "in/yafaray-macos-arm64/$f" "in/yafaray-macos-x86_64/$f" -output "out/macos/$f"
          done
          file out/macos/*.dylib | head -3
          echo "plugins: $(ls out/macos/yafaray-plugins | wc -l)"

      - name: Upload universal natives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yafaray-macos-universal
          path: out/macos
          if-no-files-found: error

  macos-test:
    name: test-macos-${{ matrix.arch }}
    needs: macos-universal
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    steps:
      - name: Check out DobryDom3D
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 26
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "26.0.2+10"

      - name: Install Ant
        run: brew install ant

      - name: Download universal natives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: yafaray-macos-universal
          path: universal

      - name: Test the universal libraries with the application's YafaRay test
        run: |
          rm -rf lib/yafaray/macosx
          mkdir -p lib/yafaray/macosx
          cp -R universal/. lib/yafaray/macosx/
          ant -noinput test-yafaray

  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out DobryDom3D
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out libYafaRay fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DobryDom3D/libYafaRay
          ref: ${{ inputs.ref }}
          path: libYafaRay

      - name: Set up Java 26 (for jni.h)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "26.0.2+10"

      - name: Set up MSYS2 (MinGW 64-bit toolchain)
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make

      - name: Build natives
        shell: msys2 {0}
        run: scripts/build-yafaray.sh libYafaRay out/windows-x64

      - name: Compare with the committed libraries
        shell: bash
        run: |
          echo "--- built plugins:   $(ls out/windows-x64/yafaray-plugins | wc -l)"
          echo "--- committed plugins: $(ls lib/yafaray/windows/x64/yafaray-plugins | wc -l)"
          diff <(ls out/windows-x64/yafaray-plugins) <(ls lib/yafaray/windows/x64/yafaray-plugins) && echo "plugin sets identical"
          echo "--- built top level";     ls out/windows-x64
          echo "--- committed top level"; ls lib/yafaray/windows/x64
        continue-on-error: true

      - name: Install Ant
        shell: bash
        run: choco install ant --yes --no-progress

      - name: Test the built libraries with the application's YafaRay test
        shell: bash
        run: |
          rm -rf lib/yafaray/windows/x64
          mkdir -p lib/yafaray/windows/x64
          cp -r out/windows-x64/. lib/yafaray/windows/x64/
          ant -noinput test-yafaray

      - name: Upload natives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yafaray-windows-x64
          path: out/windows-x64
          if-no-files-found: error

  publish:
    # Only when a release tag was given, and only if every platform built and
    # passed the application's YafaRay test.
    if: inputs.release_tag != ''
    needs: [linux-x64, macos-universal, macos-test, windows-x64]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out libYafaRay fork (to record its commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DobryDom3D/libYafaRay
          ref: ${{ inputs.ref }}
          path: libYafaRay

      - name: Download built libraries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: yafaray-*
          path: in

      - name: Package and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir dist
          for pair in linux-x64:yafaray-linux-x64 windows-x64:yafaray-windows-x64 macosx:yafaray-macos-universal; do
            name="${pair%%:*}"; dir="in/${pair##*:}"
            (cd "$dir" && zip -qr "../../dist/yafaray-natives-${name}.zip" .)
          done
          (cd dist && sha256sum *.zip | tee SHA256SUMS)
          fork_sha="$(git -C libYafaRay rev-parse HEAD)"
          notes="YafaRay native libraries for DobryDom3D, built by the Build YafaRay natives workflow.

          - libYafaRay fork commit: DobryDom3D/libYafaRay@${fork_sha}
          - DobryDom3D commit (JNI glue): ${GITHUB_SHA}
          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Fetched by the fetch-yafaray-natives Ant target; pinned by natives/yafaray.properties."
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "YafaRay natives ${TAG}" --notes "$notes" dist/*
