name: Build Windows

# Reusable: tests and packages the Windows x64 installer. Called by release.yml.
# Unsigned. NOTE: this path has not previously run in CI; expect first-run fixes.
on:
  workflow_call:
    inputs:
      version:
        description: Application version from build.xml
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache fetched test dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sweethome3d
          key: junit-4.13.2-hamcrest-1.3

      - name: Set up Java 26
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "26.0.2+10"

      - name: Install Ant
        run: choco install ant --yes --no-progress

      - name: Ensure WiX Toolset (required by jpackage --type exe)
        run: |
          if command -v candle.exe >/dev/null 2>&1 || command -v wix.exe >/dev/null 2>&1; then
            echo "WiX already on PATH"
          else
            choco install wixtoolset --yes --no-progress
            echo "C:\Program Files (x86)\WiX Toolset v3.14\bin" >> "$GITHUB_PATH"
          fi

      - name: Headless tests
        timeout-minutes: 25
        run: ant -noinput clean test

      - name: YafaRay native tests (non-gating until proven on Windows)
        continue-on-error: true
        run: ant -noinput test-yafaray

      - name: Build Windows x64 installer
        run: ant -noinput windowsInstaller

      - name: Validate installer
        run: |
          set -euo pipefail
          installers=(install/DobryDom3D-*-windows-x64.exe)
          if [ "${#installers[@]}" -ne 1 ] || [ ! -f "${installers[0]}" ]; then
            echo "::error::Expected exactly one windows-x64 exe in install/, found: ${installers[*]:-none}"
            exit 1
          fi
          size="$(stat -c %s "${installers[0]}")"
          echo "${installers[0]}: ${size} bytes"
          if [ "$size" -lt 20000000 ]; then
            echo "::error::Installer is suspiciously small (${size} bytes)"
            exit 1
          fi

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-x64
          path: install/DobryDom3D-*-windows-x64.exe
          if-no-files-found: error
