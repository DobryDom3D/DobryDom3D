name: Build macOS

# Reusable: tests and packages one DMG per CPU architecture. Called by release.yml.
# Unsigned (Gatekeeper will warn). NOTE: this path has not previously run in CI.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Application version from build.xml
        required: false
        type: string

permissions:
  contents: read

jobs:
  macos:
    name: macos-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache fetched test dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sweethome3d
          key: junit-4.13.2-hamcrest-1.3

      - name: Set up Java 26
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "26.0.2+10"

      - name: Install Ant
        run: brew install ant

      - name: Headless tests
        timeout-minutes: 25
        run: ant -noinput clean test

      - name: YafaRay native tests (non-gating until proven on macOS)
        continue-on-error: true
        run: ant -noinput test-yafaray

      - name: Build macOS DMG
        run: ant -noinput macosxInstaller

      - name: Validate DMG
        run: |
          set -euo pipefail
          dmgs=(install/DobryDom3D-*-macosx-${{ matrix.arch }}.dmg)
          if [ "${#dmgs[@]}" -ne 1 ] || [ ! -f "${dmgs[0]}" ]; then
            echo "::error::Expected exactly one macosx-${{ matrix.arch }} dmg in install/, found: ${dmgs[*]:-none}"
            exit 1
          fi
          hdiutil verify "${dmgs[0]}"

      - name: Check file associations in the app
        run: |
          set -euo pipefail
          dmg=(install/DobryDom3D-*-macosx-${{ matrix.arch }}.dmg)
          mount_point="$(mktemp -d)"
          # The DMG embeds the license agreement, which hdiutil asks to accept on stdin
          printf 'Y\n' | hdiutil attach "${dmg[0]}" -mountpoint "$mount_point" -nobrowse -readonly
          trap 'hdiutil detach "$mount_point" -force' EXIT
          plist="$(find "$mount_point" -maxdepth 4 -path '*.app/Contents/Info.plist' | head -n 1)"
          if [ -z "$plist" ]; then
            echo "::error::No app Info.plist found in ${dmg[0]}"
            exit 1
          fi
          python3 .github/scripts/check-macos-associations.py "$plist"

      - name: Upload DMG
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos-${{ matrix.arch }}
          path: install/DobryDom3D-*-macosx-${{ matrix.arch }}.dmg
          if-no-files-found: error
