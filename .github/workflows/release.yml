name: Release

# Single entry point: for a version tag (v<version>, or v<version>-<suffix> for a
# test build, published as a pre-release), builds Linux, Windows and macOS
# packages via reusable workflows, then attaches them to ONE DRAFT GitHub
# release (never published automatically). workflow_dispatch builds all
# packages as artifacts only (no release) for dry runs.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read version and verify tag
        id: version
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*<property name="version" value="\([^"]*\)"\/>.*/\1/p' build.xml | head -n 1)"
          if [ -z "$version" ]; then
            echo "::error::Could not read version property from build.xml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # v<version> is a release; v<version>-<suffix> (e.g. v0.1.0-test1) is a
          # test build of that version and is published as a pre-release.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            case "${GITHUB_REF_NAME}" in
              "v${version}"|"v${version}-"?*) ;;
              *)
                echo "::error::Tag ${GITHUB_REF_NAME} does not match build.xml version v${version} (or v${version}-<suffix> for a test build)"
                exit 1 ;;
            esac
          fi

  linux:
    needs: version
    uses: ./.github/workflows/_build-linux.yml
    with:
      version: ${{ needs.version.outputs.version }}

  windows:
    needs: version
    uses: ./.github/workflows/_build-windows.yml
    with:
      version: ${{ needs.version.outputs.version }}

  macos:
    needs: version
    uses: ./.github/workflows/_build-macos.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    # Only for tag pushes, and only when every platform build succeeded.
    if: github.ref_type == 'tag'
    needs: [version, linux, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Write is required only to attach assets to a DRAFT release.
    permissions:
      contents: write
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          set -euo pipefail
          ls -l
          sha256sum DobryDom3D-* > SHA256SUMS
          cat SHA256SUMS

      - name: Attach assets to draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            draft="$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq '.isDraft')"
            if [ "${draft}" != "true" ]; then
              echo "::error::Release ${GITHUB_REF_NAME} already exists and is published; refusing to modify it"
              exit 1
            fi
            echo "Draft release exists; replacing assets"
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            prerelease=()
            title="DobryDom3D ${{ needs.version.outputs.version }}"
            if [ "${GITHUB_REF_NAME}" != "v${{ needs.version.outputs.version }}" ]; then
              prerelease=(--prerelease)
              title="DobryDom3D ${GITHUB_REF_NAME#v} (test build)"
            fi
            gh release create "${GITHUB_REF_NAME}" \
              --draft --verify-tag "${prerelease[@]}" \
              --title "${title}" \
              --generate-notes \
              dist/*
          fi
