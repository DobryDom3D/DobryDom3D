name: Build Linux

# Reusable: tests and packages the Linux x64 archive. Called by release.yml.
on:
  workflow_call:
    inputs:
      version:
        description: Application version from build.xml
        required: true
        type: string

permissions:
  contents: read

jobs:
  linux-x64:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache fetched test dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sweethome3d
          key: junit-4.13.2-hamcrest-1.3

      - name: Set up Java 26
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          # Keep in sync with Taskfile.yml JAVA_VERSION / .tool-versions
          java-version: "26.0.2+10"

      - name: Install build and test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ant ant-optional xvfb

      - name: Test and build
        timeout-minutes: 35
        run: xvfb-run -a -s "-screen 0 1920x1080x24 -ac +extension GLX +render -noreset" ant -noinput ci-full

      - name: Build Linux x64 archive
        run: ant -noinput linux64Installer

      - name: Validate release archive
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          archive_root="DobryDom3D-${version}"
          archives=(install/DobryDom3D-*-linux-x64.tgz)
          if [ "${#archives[@]}" -ne 1 ] || [ ! -f "${archives[0]}" ]; then
            echo "::error::Expected exactly one linux-x64 tgz in install/, found: ${archives[*]:-none}"
            exit 1
          fi
          archive="${archives[0]}"
          gzip --test "$archive"
          listing="$(tar -tzf "$archive")"
          printf '%s\n' "$listing"
          for required in \
            "${archive_root}/bin/DobryDom3D" \
            "${archive_root}/lib/app/DobryDom3D.jar"; do
            if ! grep -Fxq "$required" <<<"$listing"; then
              echo "::error::Archive is missing required entry: $required"
              exit 1
            fi
          done

      - name: Upload release archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-x64
          path: install/DobryDom3D-*-linux-x64.tgz
          if-no-files-found: error
