# YafaRay native libraries (core, plugins and JNI glue), built from
# DobryDom3D/libYafaRay by the "Build YafaRay natives" workflow and published
# as a GitHub release. build.xml's fetch-yafaray-natives target downloads them
# into lib/yafaray (not committed) and verifies the checksums below.
#
# To update: run the workflow with a new release_tag (yafaray-natives-N), then
# set the version and the three checksums (see the release's SHA256SUMS).
yafaray.natives.version=1
yafaray.natives.baseurl=https://github.com/DobryDom3D/DobryDom3D/releases/download/yafaray-natives-${yafaray.natives.version}
yafaray.natives.linux-x64.sha256=1dea9dffcc1f1a1c29bed143a1658f3209cebc83eb9c5de0eb7e5f754973481f
yafaray.natives.windows-x64.sha256=99bc18c567f72aa7a6dbf34c3d66a4a64e6631d467084489005245b417f400aa
yafaray.natives.macosx.sha256=c10545ec64db4628f5c9a5120da4a6ddf2585f6319f95e1dd2a82028f19f72ba
